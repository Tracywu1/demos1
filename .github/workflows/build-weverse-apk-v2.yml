name: Build Weverse Translator Plus APK

on:
  push:
    branches:
      - weverse-translator-apk-build
    paths:
      - ".github/workflows/build-weverse-apk-v2.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Restore project payload
        shell: bash
        run: |
          rm -rf /tmp/weverse-translator
          mkdir -p /tmp/weverse-translator
          awk '/^[[:space:]]*H4sI/{capture=1} capture{gsub(/[[:space:]]/, ""); print} /^[[:space:]]*PAYLOAD$/{exit}' .github/workflows/build-weverse-apk.yml | sed '/PAYLOAD/d' > /tmp/weverse-project.b64
          base64 -d -i /tmp/weverse-project.b64 > /tmp/weverse-project.tgz
          tar -xzf /tmp/weverse-project.tgz -C /tmp/weverse-translator
          test -f /tmp/weverse-translator/settings.gradle.kts
      - name: Build debug APK
        working-directory: /tmp/weverse-translator
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weverse-translator-plus-v0.2-apk
          path: /tmp/weverse-translator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
