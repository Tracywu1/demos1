name: Build Weverse Translator APK

on:
  push:
    branches:
      - weverse-translator-apk-build
    paths:
      - ".github/workflows/build-weverse-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Restore project
        shell: bash
        run: |
          mkdir -p /tmp/weverse-translator
          cat > /tmp/weverse-project.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/weverse-project.b64 > /tmp/weverse-project.tgz
          tar -xzf /tmp/weverse-project.tgz -C /tmp/weverse-translator
      - name: Build debug APK
        working-directory: /tmp/weverse-translator
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weverse-translator-debug-apk
          path: /tmp/weverse-translator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
