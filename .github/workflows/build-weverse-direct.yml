name: Build Weverse Translator Direct

on:
  push:
    branches:
      - weverse-translator-apk-build
    paths:
      - ".github/workflows/build-weverse-direct.yml"
      - "weverse-plus/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build debug APK
        working-directory: weverse-plus
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weverse-translator-plus-v0.2.1-apk
          path: weverse-plus/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
